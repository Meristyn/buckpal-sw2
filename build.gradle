plugins {
    id 'jacoco'
    id 'org.springframework.boot' version '3.1.0'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'org.sonarqube' version '4.4.1.3373'
}

group = 'io.reflectoring.buckpal'
version = '0.0.1-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'java-library'

repositories {
    mavenCentral()
}

// Versión de Selenium para pruebas de caja negra (sobrescribe la que trae Spring Boot 3.1
// para que todos los módulos de Selenium usen la misma versión que selenium-java).
ext['selenium.version'] = '4.52.0'

compileJava {
    sourceCompatibility = 17
    targetCompatibility = 17
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.3.1'
    testImplementation 'com.tngtech.archunit:archunit:1.0.1'
    testImplementation 'com.h2database:h2'

    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.2'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.52.0'

    runtimeOnly 'com.h2database:h2'
}

test {
    useJUnitPlatform()
    exclude 'io/reflectoring/buckpal/blackbox/**'
    finalizedBy jacocoTestReport
}

tasks.register('blackboxTest', Test) {
    description = 'Ejecuta las pruebas funcionales E2E de caja negra con Selenium.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include 'io/reflectoring/buckpal/blackbox/**'
    shouldRunAfter test
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    executionData.setFrom(fileTree(buildDir).include('/jacoco/*.exec'))
    reports {
        xml.required = true
        html.required = true
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'buckpal-sw2'
        property 'sonar.projectName', 'BuckPal SW2'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.coverage.jacoco.xmlReportPaths', "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
    }
}
