<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BuckPal</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			background: #f4f5f7;
			color: #1f2933;
		}
		header {
			background: #1f3a5f;
			color: #fff;
			padding: 16px 24px;
		}
		header h1 { margin: 0; font-size: 1.4rem; }
		main {
			max-width: 760px;
			margin: 24px auto;
			padding: 0 16px;
			display: grid;
			gap: 20px;
		}
		section {
			background: #fff;
			border: 1px solid #d9dee5;
			border-radius: 8px;
			padding: 20px;
		}
		section h2 { margin-top: 0; font-size: 1.1rem; }
		label { display: block; font-weight: 600; margin: 12px 0 4px; }
		input {
			width: 100%;
			padding: 8px 10px;
			border: 1px solid #b8c1cc;
			border-radius: 6px;
			font-size: 1rem;
		}
		button {
			margin-top: 16px;
			padding: 9px 18px;
			border: 0;
			border-radius: 6px;
			background: #1f3a5f;
			color: #fff;
			font-size: 1rem;
			cursor: pointer;
		}
		button:hover { background: #2c5282; }
		.message { padding: 12px 16px; border-radius: 6px; font-weight: 600; }
		.message.success { background: #e3f6e8; color: #1b5e2b; border: 1px solid #9fd8ae; }
		.message.error { background: #fdecec; color: #8a1c1c; border: 1px solid #f1a8a8; }
		.balance { font-size: 1.6rem; font-weight: 700; margin-top: 12px; }
	</style>
</head>
<body>
<header>
	<h1>BuckPal</h1>
</header>

<main>
	<div id="message"
		 th:if="${message}"
		 th:class="'message ' + ${messageType}"
		 th:text="${message}">mensaje</div>

	<section id="balance-section">
		<h2>Consultar saldo</h2>
		<form id="balance-form" method="post" th:action="@{/balance}">
			<label for="balance-account-id">ID de la cuenta</label>
			<input id="balance-account-id" name="accountId" type="text" inputmode="numeric"
				   autocomplete="off" th:value="${balanceAccountId}">
			<button id="balance-submit" type="submit">Consultar</button>
		</form>
		<div th:if="${balanceResult}" class="balance">
			Saldo: <span id="balance-result" th:text="${balanceResult}">0</span>
		</div>
	</section>

	<section id="transfer-section">
		<h2>Transferir dinero</h2>
		<form id="transfer-form" method="post" th:action="@{/transfer}">
			<label for="source-account-id">Cuenta de origen</label>
			<input id="source-account-id" name="sourceAccountId" type="text" inputmode="numeric"
				   autocomplete="off" th:value="${sourceAccountId}">

			<label for="target-account-id">Cuenta de destino</label>
			<input id="target-account-id" name="targetAccountId" type="text" inputmode="numeric"
				   autocomplete="off" th:value="${targetAccountId}">

			<label for="amount">Monto</label>
			<input id="amount" name="amount" type="text" inputmode="numeric"
				   autocomplete="off" th:value="${amount}">

			<button id="transfer-submit" type="submit">Transferir</button>
		</form>
	</section>
</main>
</body>
</html>
